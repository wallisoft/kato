name: Release

# Push a tag like v0.3.0 and this compiles Kato to native code with Nuitka,
# builds the Windows installer and the Linux package, and publishes them to the
# PUBLIC repo wallisoft/kato-releases. The source stays in this private repo.
# Needs the RELEASES_TOKEN secret (fine-grained token: kato-releases, Contents read/write).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Tag must match VERSION in kato.py
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CODE=$(grep -m1 '^VERSION' kato.py | cut -d'"' -f2)
          echo "tag=$TAG code=$CODE"
          [ "$TAG" = "$CODE" ] || { echo "::error::Tag v$TAG doesn't match VERSION $CODE"; exit 1; }
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nuitka ordered-set zstandard
          choco install innosetup -y --no-progress
      - name: Make the icon (a blue dot)
        run: python packaging/make_icon.py packaging/kato.ico
      - name: Compile with Nuitka
        run: |
          python -m nuitka --standalone --assume-yes-for-downloads --enable-plugin=pyside6 `
            --windows-console-mode=disable --windows-icon-from-ico=packaging/kato.ico `
            --include-module=pynput.keyboard._win32 --include-module=pynput.mouse._win32 `
            --company-name=Wallisoft --product-name=Kato `
            --file-version=${{ needs.check.outputs.version }} --product-version=${{ needs.check.outputs.version }} `
            --output-dir=build kato.py
      - name: Compile the secure-desktop service with Nuitka
        run: |
          python -m pip install pywin32
          python -m nuitka --standalone --assume-yes-for-downloads `
            --include-module=win32timezone --include-module=servicemanager `
            --include-module=ntsecuritycon --include-module=win32security `
            --include-module=win32service --include-module=win32file --include-module=win32pipe `
            --output-filename=kato-service.exe `
            --company-name=Wallisoft --product-name="Kato Input Service" `
            --file-version=${{ needs.check.outputs.version }} --product-version=${{ needs.check.outputs.version }} `
            --output-dir=build packaging/kato_service.py
      - name: Build Kato-Setup.exe
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ needs.check.outputs.version }}" packaging\kato.iss
      - name: Build Kato.msix (Microsoft Store)
        # Only when the Store identity is set (repository variables, from Partner Center > Product identity).
        # The Store package is the app alone: the lock-screen service cannot be shipped through the Store.
        if: vars.MSIX_IDENTITY_NAME != ''
        shell: pwsh
        env:
          ID: ${{ vars.MSIX_IDENTITY_NAME }}
          PUB: ${{ vars.MSIX_PUBLISHER }}
          PUBDISP: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
        run: |
          $p = "${{ needs.check.outputs.version }}".Split('.'); while ($p.Count -lt 3) { $p += '0' }
          $v = "$($p[0]).$($p[1]).$($p[2]).0"
          New-Item -ItemType Directory msix\Assets -Force | Out-Null
          Copy-Item -Recurse build\kato.dist\* msix\
          Copy-Item packaging\THIRD-PARTY-NOTICES.txt msix\
          python packaging/make_icon.py msix/Assets/Square150x150Logo.png 150
          python packaging/make_icon.py msix/Assets/Square44x44Logo.png 44
          python packaging/make_icon.py msix/Assets/StoreLogo.png 50
          (Get-Content packaging\AppxManifest.xml -Raw).Replace('@IDENTITY_NAME@', $env:ID).Replace('@PUBLISHER@', $env:PUB).Replace('@PUBLISHER_DISPLAY@', $env:PUBDISP).Replace('@VERSION@', $v) | Set-Content msix\AppxManifest.xml -Encoding utf8
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $makeappx.FullName pack /d msix /p Kato.msix /o
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            packaging/Output/Kato-Setup.exe
            Kato.msix
          if-no-files-found: warn

  linux:
    needs: check
    runs-on: ubuntu-22.04        # older base = runs on older and newer distros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf libxcb-cursor0 libgl1 libegl1 libxkbcommon-x11-0
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nuitka ordered-set zstandard
      - name: Compile with Nuitka
        run: |
          python -m nuitka --standalone --assume-yes-for-downloads --enable-plugin=pyside6 \
            --include-module=pynput.keyboard._xorg --include-module=pynput.mouse._xorg \
            --include-module=kato_uinput --include-module=kato_capture \
            --include-package=Xlib --output-dir=build kato.py
      - name: Package
        run: |
          mv build/kato.dist kato
          python packaging/make_icon.py kato/kato.png
          cp packaging/THIRD-PARTY-NOTICES.txt kato/
          # The Wayland capture helper is run by the system Python, so it ships as a plain script next to the program.
          cp kato_capture_helper.py kato/
          cp packaging/kato-input.service kato/
          test -f kato/kato_capture_helper.py && python3 -m py_compile kato_capture_helper.py
          tar czf kato-linux-x86_64.tar.gz kato
          cp packaging/install.sh install.sh
          # Linux packages: .deb (Debian/Ubuntu/Mint) + no-FUSE AppImage (all other distros)
          chmod +x packaging/linux-package.sh
          packaging/linux-package.sh --bundle kato --name kato --app "Kato KVM" \
            --version "${{ needs.check.outputs.version }}" --exe kato.bin --icon kato/kato.png \
            --desc "One keyboard and mouse for all your computers. Windows and Linux." \
            --depends "libc6, libgl1, libegl1, libxcb-cursor0, libxkbcommon-x11-0" --out dist
          mv dist/kato_*_amd64.deb kato-amd64.deb
          mv dist/Kato-KVM-*-x86_64.AppImage Kato-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            kato-linux-x86_64.tar.gz
            install.sh
            kato-amd64.deb
            Kato-x86_64.AppImage

  publish:
    needs: [check, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Make sure everything made it
        run: |
          for f in Kato-Setup.exe kato-linux-x86_64.tar.gz install.sh kato-amd64.deb Kato-x86_64.AppImage; do
            find . -name "$f" | grep -q . || { echo "::error::$f is missing"; exit 1; }
          done
          find . -name Kato.msix | grep -q . && echo "Store package included" || echo "no Store package this time (set the MSIX_* variables)"
      - uses: softprops/action-gh-release@v2
        with:
          repository: wallisoft/kato-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Kato ${{ needs.check.outputs.version }}
          body: |
            **Windows 10 and 11:** download `Kato-Setup.exe` and run it.
            **Linux — Ubuntu / Mint / Debian:** download `kato-amd64.deb` and double-click (or `sudo apt install ./kato-amd64.deb`).
            **Linux — any other distro:** download `Kato-x86_64.AppImage`, make it executable, run it.
            **Linux — one-liner (any distro):** `curl -fsSL https://github.com/wallisoft/kato-releases/releases/latest/download/install.sh | bash`
          files: |
            **/Kato-Setup.exe
            **/kato-linux-x86_64.tar.gz
            **/install.sh
            **/Kato.msix
            **/kato-amd64.deb
            **/Kato-x86_64.AppImage
