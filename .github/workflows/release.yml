name: Release

# Push a tag like v0.3.0 and this compiles Juska to native code with Nuitka,
# builds the Windows installer and the Linux package, and publishes them to the
# PUBLIC repo wallisoft/juska-releases. The source stays in this private repo.
# Needs the RELEASES_TOKEN secret (fine-grained token: juska-releases, Contents read/write).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Tag must match VERSION in juska.py
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CODE=$(grep -m1 '^VERSION' juska.py | cut -d'"' -f2)
          echo "tag=$TAG code=$CODE"
          [ "$TAG" = "$CODE" ] || { echo "::error::Tag v$TAG doesn't match VERSION $CODE"; exit 1; }
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nuitka ordered-set zstandard
          choco install innosetup -y --no-progress
      - name: Make the icon (a blue dot)
        run: python packaging/make_icon.py packaging/juska.ico
      - name: Compile with Nuitka
        run: |
          python -m nuitka --standalone --assume-yes-for-downloads --enable-plugin=pyside6 `
            --windows-console-mode=disable --windows-icon-from-ico=packaging/juska.ico `
            --include-module=pynput.keyboard._win32 --include-module=pynput.mouse._win32 `
            --company-name=Wallisoft --product-name=Juska `
            --file-version=${{ needs.check.outputs.version }} --product-version=${{ needs.check.outputs.version }} `
            --output-dir=build juska.py
      - name: Compile the secure-desktop service with Nuitka
        run: |
          python -m pip install pywin32
          python -m nuitka --standalone --assume-yes-for-downloads `
            --include-module=win32timezone --include-module=servicemanager `
            --include-module=ntsecuritycon --include-module=win32security `
            --include-module=win32service --include-module=win32file --include-module=win32pipe `
            --output-filename=juska-service.exe `
            --company-name=Wallisoft --product-name="Juska Input Service" `
            --file-version=${{ needs.check.outputs.version }} --product-version=${{ needs.check.outputs.version }} `
            --output-dir=build packaging/juska_service.py
      - name: Build Juska-Setup.exe
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ needs.check.outputs.version }}" packaging\juska.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: packaging/Output/Juska-Setup.exe

  linux:
    needs: check
    runs-on: ubuntu-22.04        # older base = runs on older and newer distros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf libxcb-cursor0 libgl1 libegl1 libxkbcommon-x11-0
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nuitka ordered-set zstandard
      - name: Compile with Nuitka
        run: |
          python -m nuitka --standalone --assume-yes-for-downloads --enable-plugin=pyside6 \
            --include-module=pynput.keyboard._xorg --include-module=pynput.mouse._xorg \
            --include-module=juska_uinput --include-module=juska_capture \
            --include-package=Xlib --output-dir=build juska.py
      - name: Package
        run: |
          mv build/juska.dist juska
          python packaging/make_icon.py juska/juska.png
          cp packaging/THIRD-PARTY-NOTICES.txt juska/
          # The Wayland capture helper is run by the system Python, so it ships as a plain script next to the program.
          cp juska_capture_helper.py juska/
          test -f juska/juska_capture_helper.py && python3 -m py_compile juska_capture_helper.py
          tar czf juska-linux-x86_64.tar.gz juska
          cp packaging/install.sh install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            juska-linux-x86_64.tar.gz
            install.sh

  publish:
    needs: [check, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Make sure everything made it
        run: |
          for f in Juska-Setup.exe juska-linux-x86_64.tar.gz install.sh; do
            find . -name "$f" | grep -q . || { echo "::error::$f is missing"; exit 1; }
          done
      - uses: softprops/action-gh-release@v2
        with:
          repository: wallisoft/juska-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Juska ${{ needs.check.outputs.version }}
          body: |
            **Windows 10 and 11:** download `Juska-Setup.exe` and run it.
            **Linux (Ubuntu, Mint, Debian, Fedora, Arch and similar; X11 and Wayland):** `curl -fsSL https://github.com/wallisoft/juska-releases/releases/latest/download/install.sh | bash`
          files: |
            **/Juska-Setup.exe
            **/juska-linux-x86_64.tar.gz
            **/install.sh
