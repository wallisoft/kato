name: Release

# Push a tag like v0.3.0 and this compiles AirShare to native code with Nuitka,
# builds the Windows installer and the Linux package, and publishes them to the
# PUBLIC repo wallisoft/airshare-releases. The source stays in this private repo.
# Needs the RELEASES_TOKEN secret (fine-grained token: airshare-releases, Contents read/write).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Tag must match VERSION in airshare.py
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CODE=$(grep -m1 '^VERSION' airshare.py | cut -d'"' -f2)
          echo "tag=$TAG code=$CODE"
          [ "$TAG" = "$CODE" ] || { echo "::error::Tag v$TAG doesn't match VERSION $CODE"; exit 1; }
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nuitka ordered-set zstandard
          choco install innosetup -y --no-progress
      - name: Make the icon (a blue dot)
        run: python packaging/make_icon.py packaging/airshare.ico
      - name: Compile with Nuitka
        run: |
          python -m nuitka --standalone --assume-yes-for-downloads --enable-plugin=pyside6 `
            --windows-console-mode=disable --windows-icon-from-ico=packaging/airshare.ico `
            --include-module=pynput.keyboard._win32 --include-module=pynput.mouse._win32 `
            --company-name=Wallisoft --product-name=AirShare `
            --file-version=${{ needs.check.outputs.version }} --product-version=${{ needs.check.outputs.version }} `
            --output-dir=build airshare.py
      - name: Build AirShare-Setup.exe
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ needs.check.outputs.version }}" packaging\airshare.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: packaging/Output/AirShare-Setup.exe

  linux:
    needs: check
    runs-on: ubuntu-22.04        # older base = runs on older and newer distros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf libxcb-cursor0 libgl1 libegl1 libxkbcommon-x11-0
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nuitka ordered-set zstandard
      - name: Compile with Nuitka
        run: |
          python -m nuitka --standalone --assume-yes-for-downloads --enable-plugin=pyside6 \
            --include-module=pynput.keyboard._xorg --include-module=pynput.mouse._xorg \
            --include-package=Xlib --output-dir=build airshare.py
      - name: Package
        run: |
          mv build/airshare.dist airshare
          python packaging/make_icon.py airshare/airshare.png
          cp packaging/THIRD-PARTY-NOTICES.txt airshare/
          tar czf airshare-linux-x86_64.tar.gz airshare
          cp packaging/install.sh install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            airshare-linux-x86_64.tar.gz
            install.sh

  publish:
    needs: [check, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Make sure everything made it
        run: |
          for f in AirShare-Setup.exe airshare-linux-x86_64.tar.gz install.sh; do
            find . -name "$f" | grep -q . || { echo "::error::$f is missing"; exit 1; }
          done
      - uses: softprops/action-gh-release@v2
        with:
          repository: wallisoft/airshare-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: AirShare ${{ needs.check.outputs.version }}
          body: |
            **Windows 10 and 11:** download `AirShare-Setup.exe` and run it.
            **Linux (Ubuntu 22.04+ and similar, X11):** `curl -fsSL https://github.com/wallisoft/airshare-releases/releases/latest/download/install.sh | bash`
          files: |
            **/AirShare-Setup.exe
            **/airshare-linux-x86_64.tar.gz
            **/install.sh
