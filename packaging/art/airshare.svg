<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- rounded tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <!-- left screen -->
  <rect x="62" y="150" width="168" height="120" rx="16" fill="#ffffff" fill-opacity="0.95"/>
  <rect x="132" y="270" width="28" height="30" fill="#ffffff" fill-opacity="0.95"/>
  <rect x="102" y="298" width="88" height="14" rx="7" fill="#ffffff" fill-opacity="0.95"/>
  <!-- right screen -->
  <rect x="282" y="150" width="168" height="120" rx="16" fill="#ffffff" fill-opacity="0.95"/>
  <rect x="352" y="270" width="28" height="30" fill="#ffffff" fill-opacity="0.95"/>
  <rect x="322" y="298" width="88" height="14" rx="7" fill="#ffffff" fill-opacity="0.95"/>
  <!-- the glide: a dashed arc from one screen to the other -->
  <path d="M150 210 C 210 120, 302 120, 362 196" fill="none" stroke="#1e3a8a" stroke-width="12"
        stroke-linecap="round" stroke-dasharray="2 26"/>
  <!-- pointer arriving on the right screen -->
  <path d="M352 182 L352 252 L370 236 L383 264 L396 258 L383 231 L407 229 Z"
        fill="#1e3a8a" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
  <!-- keyboard -->
  <rect x="142" y="352" width="228" height="62" rx="14" fill="#ffffff" fill-opacity="0.95"/>
  <g fill="#93c5fd">
    <rect x="162" y="366" width="26" height="14" rx="3"/><rect x="196" y="366" width="26" height="14" rx="3"/>
    <rect x="230" y="366" width="26" height="14" rx="3"/><rect x="264" y="366" width="26" height="14" rx="3"/>
    <rect x="298" y="366" width="26" height="14" rx="3"/><rect x="332" y="366" width="20" height="14" rx="3"/>
    <rect x="196" y="388" width="120" height="14" rx="3"/>
  </g>
</svg>
